services:
  mongo:
    image: mongo:7.0
    container_name: workwave-mongo
    restart: unless-stopped
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
    networks:
      - workwave-net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: workwave-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017/workwave
      - CLIENT_URL=http://localhost:5173
      - JWT_SECRET=workwave_jwt_secret_dev_key_8923489234
      - JWT_EXPIRES_IN=7d
      - MAX_FILE_SIZE_MB=25
      - UPLOAD_DIR=uploads
      - AUTO_SEED=true
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - workwave-net

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: workwave-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
      - VITE_SOCKET_URL=http://localhost:5000
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server
    networks:
      - workwave-net

volumes:
  mongo_data:
  uploads_data:

networks:
  workwave-net:
    driver: bridge
