<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="teamsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B83EB" />
      <stop offset="100%" stop-color="#5B5FC7" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#teamsGrad)" />
  
  <!-- Back person silhouette -->
  <circle cx="340" cy="180" r="48" fill="#FFFFFF" opacity="0.85" />
  <path d="M260 330 C260 260, 310 240, 350 240 C390 240, 440 260, 440 330 Z" fill="#FFFFFF" opacity="0.85" />
  
