  <rect x="100" y="140" width="220" height="230" rx="36" fill="#4B4E99" filter="url(#shadow)" />
  <!-- 'T' letter -->
  <path d="M140 185 L280 185 L280 220 L228 220 L228 335 L192 335 L192 220 L140 220 Z" fill="#FFFFFF" />
